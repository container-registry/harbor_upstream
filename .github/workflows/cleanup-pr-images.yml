name: Cleanup PR Images

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not delete)'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  GHCR_NAMESPACE: container-registry/harbor-next
  RETENTION_DAYS: 7

jobs:
  cleanup:
    name: Cleanup Old PR Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type -p gh >/dev/null || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Find closed PRs older than retention period
        id: find-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RETENTION_DAYS: ${{ env.RETENTION_DAYS }}
        run: |
          # Calculate cutoff date (RETENTION_DAYS ago)
          cutoff_date=$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)

          echo "Cutoff date: ${cutoff_date}"

          # Find closed PRs older than cutoff date
          pr_numbers=$(gh pr list \
            --repo "${REPO}" \
            --state closed \
            --json number,closedAt \
            --jq ".[] | select(.closedAt < \"${cutoff_date}\") | .number")

          if [ -z "${pr_numbers}" ]; then
            echo "No PRs to clean up"
            echo "pr_numbers=" >> $GITHUB_OUTPUT
          else
            echo "Found PRs to clean up: ${pr_numbers}"
            # Convert to comma-separated list
            pr_list=$(echo "${pr_numbers}" | tr '\n' ',' | sed 's/,$//')
            echo "pr_numbers=${pr_list}" >> $GITHUB_OUTPUT
          fi

      - name: Delete PR images from GHCR
        if: steps.find-prs.outputs.pr_numbers != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBERS: ${{ steps.find-prs.outputs.pr_numbers }}
          NAMESPACE: ${{ env.GHCR_NAMESPACE }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Services to clean up
          services=("core" "jobservice" "registryctl" "portal" "db" "redis" "registry" "nginx")

          # Split PR numbers by comma
          IFS=',' read -ra prs <<< "${PR_NUMBERS}"

          for pr_number in "${prs[@]}"; do
            echo "Processing PR #${pr_number}"

            for service in "${services[@]}"; do
              package_name="harbor-${service}"

              # List all versions for this package
              versions=$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/orgs/container-registry/packages/container/${package_name}/versions" \
                --jq ".[] | select(.metadata.container.tags[] | contains(\"pr-${pr_number}\")) | .id" 2>/dev/null || echo "")

              if [ -z "${versions}" ]; then
                echo "  No images found for ${package_name}:pr-${pr_number}"
                continue
              fi

              echo "  Found image versions for ${package_name}:pr-${pr_number}"

              for version_id in ${versions}; do
                if [ "${DRY_RUN}" = "true" ]; then
                  echo "  [DRY RUN] Would delete ${package_name} version ${version_id}"
                else
                  echo "  Deleting ${package_name} version ${version_id}"
                  gh api \
                    --method DELETE \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "/orgs/container-registry/packages/container/${package_name}/versions/${version_id}" || echo "  Failed to delete version ${version_id}"
                fi
              done
            done

            echo "Completed cleanup for PR #${pr_number}"
          done

      - name: Summary
        if: always()
        env:
          PR_NUMBERS: ${{ steps.find-prs.outputs.pr_numbers }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "## Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -z "${PR_NUMBERS}" ]; then
            echo "No PR images found for cleanup." >> $GITHUB_STEP_SUMMARY
          else
            echo "Processed PRs: ${PR_NUMBERS}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "${DRY_RUN}" = "true" ]; then
              echo "**Mode**: Dry run (no deletions performed)" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Mode**: Live (images deleted)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Retention period**: ${{ env.RETENTION_DAYS }} days" >> $GITHUB_STEP_SUMMARY
