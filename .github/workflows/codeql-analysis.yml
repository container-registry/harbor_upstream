name: "CodeQL Code Scanning"

on:
  push:
    branches:
      - next
      - main
  pull_request:
    branches:
      - next
      - main
    paths:
      - '**.go'
      - '**.js'
      - '**.ts'
      - '**.tsx'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 2 * * 1-5' # run at 2 AM UTC Monday through Friday

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required for uploading SARIF results
      contents: read          # Required for private repos
      actions: read           # Required for analyzing workflow files

    strategy:
      fail-fast: false
      matrix:
        # Analyze Go and JavaScript/TypeScript separately for better performance
        language: ['go', 'javascript-typescript']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # Generate Swagger API code for Go to get 100% file coverage
    - name: Generate API code from Swagger
      if: matrix.language == 'go'
      run: |
        # Install go-swagger
        curl -o /tmp/swagger -L https://github.com/go-swagger/go-swagger/releases/download/v0.31.0/swagger_linux_amd64
        chmod +x /tmp/swagger

        # Generate server code from swagger spec
        /tmp/swagger generate server \
          --template-dir=tools/swagger/templates \
          --exclude-main \
          --additional-initialism=CVE \
          --additional-initialism=GC \
          --additional-initialism=OIDC \
          -f api/v2.0/swagger.yaml \
          -A harbor \
          --target src/server/v2.0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Use security-extended query suite for maximum security coverage
        queries: +security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
