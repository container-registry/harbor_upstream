# Docker Image Building Tasks
# Uses Dockerfiles in dockerfiles/ directory

version: '3'

includes:
  build: ./build.yml

vars:
  # Registry configuration
  REGISTRY: '{{.REGISTRY | default "registry.goharbor.io"}}'
  IMAGE_NAMESPACE: '{{.IMAGE_NAMESPACE | default "harbor-next"}}'
  IMAGE_TAG: '{{.IMAGE_TAG | default .VERSION}}'
  USE_CACHE: '{{.USE_CACHE | default "true"}}'

tasks:
  # ============================================================================
  # Aggregate Image Build Tasks
  # ============================================================================

  all-images:
    desc: "🐳 Build all Harbor Docker images for all platforms"
    deps:
      - image:core:linux-amd64
      - image:core:linux-arm64
      - image:jobservice:linux-amd64
      - image:jobservice:linux-arm64
      - image:registryctl:linux-amd64
      - image:registryctl:linux-arm64
      - image:exporter:linux-amd64
      - image:exporter:linux-arm64
      - image:portal:linux-amd64
      - image:portal:linux-arm64
      - image:registry:linux-amd64
      - image:registry:linux-arm64
      - image:trivy-adapter:linux-amd64
      - image:trivy-adapter:linux-arm64
      - image:nginx:linux-amd64
      - image:nginx:linux-arm64
    cmds:
      - |
        echo "✓ All images built successfully"
        echo ""
        docker images | grep goharbor

  all-images:amd64:
    desc: "🐳 Build all images for linux/amd64"
    deps:
      - image:core:linux-amd64
      - image:jobservice:linux-amd64
      - image:registryctl:linux-amd64
      - image:exporter:linux-amd64
      - image:portal:linux-amd64
      - image:registry:linux-amd64
      - image:trivy-adapter:linux-amd64
      - image:nginx:linux-amd64
    cmds:
      - echo "✓ All AMD64 images built"

  all-images:arm64:
    desc: "🐳 Build all images for linux/arm64"
    deps:
      - image:core:linux-arm64
      - image:jobservice:linux-arm64
      - image:registryctl:linux-arm64
      - image:exporter:linux-arm64
      - image:portal:linux-arm64
      - image:registry:linux-arm64
      - image:trivy-adapter:linux-arm64
      - image:nginx:linux-arm64
    cmds:
      - echo "✓ All ARM64 images built"

  # ============================================================================
  # Core Image (requires binary)
  # ============================================================================

  image:core:*:
    desc: "Build Harbor Core Docker image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: "goharbor/harbor-core:{{.VERSION}}-{{.PLATFORM}}"
    deps:
      - build:binary:core:{{.PLATFORM}}
    cmds:
      - |
        echo "🐳 Building Core image for {{.PLATFORM}}..."
        docker buildx build \
          --platform linux/{{.ARCH}} \
          --build-arg TARGETARCH={{.ARCH}} \
          -t {{.TAG}} \
          -f dockerfiles/core.dockerfile \
          --load \
          .
      - |
        echo "✓ Core image built: {{.TAG}}"
        docker images | grep harbor-core | head -1

  # ============================================================================
  # Jobservice Image (requires binary)
  # ============================================================================

  image:jobservice:*:
    desc: "Build Harbor Jobservice Docker image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: "goharbor/harbor-jobservice:{{.VERSION}}-{{.PLATFORM}}"
    deps:
      - build:binary:jobservice:{{.PLATFORM}}
    cmds:
      - |
        echo "🐳 Building Jobservice image for {{.PLATFORM}}..."
        docker buildx build \
          --platform linux/{{.ARCH}} \
          --build-arg TARGETARCH={{.ARCH}} \
          -t {{.TAG}} \
          -f dockerfiles/jobservice.dockerfile \
          --load \
          .
      - |
        echo "✓ Jobservice image built: {{.TAG}}"
        docker images | grep harbor-jobservice | head -1

  # ============================================================================
  # Registryctl Image (requires binary)
  # ============================================================================

  image:registryctl:*:
    desc: "Build Harbor Registryctl Docker image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: "goharbor/harbor-registryctl:{{.VERSION}}-{{.PLATFORM}}"
    deps:
      - build:binary:registryctl:{{.PLATFORM}}
    cmds:
      - |
        echo "🐳 Building Registryctl image for {{.PLATFORM}}..."
        docker buildx build \
          --platform linux/{{.ARCH}} \
          --build-arg TARGETARCH={{.ARCH}} \
          -t {{.TAG}} \
          -f dockerfiles/registryctl.dockerfile \
          --load \
          .
      - |
        echo "✓ Registryctl image built: {{.TAG}}"
        docker images | grep harbor-registryctl | head -1

  # ============================================================================
  # Exporter Image (requires binary)
  # ============================================================================

  image:exporter:*:
    desc: "Build Harbor Exporter Docker image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: "goharbor/harbor-exporter:{{.VERSION}}-{{.PLATFORM}}"
    deps:
      - build:binary:exporter:{{.PLATFORM}}
    cmds:
      - |
        echo "🐳 Building Exporter image for {{.PLATFORM}}..."
        docker buildx build \
          --platform linux/{{.ARCH}} \
          --build-arg TARGETARCH={{.ARCH}} \
          -t {{.TAG}} \
          -f dockerfiles/exporter.dockerfile \
          --load \
          .
      - |
        echo "✓ Exporter image built: {{.TAG}}"
        docker images | grep harbor-exporter | head -1

  # ============================================================================
  # Portal Image (multi-stage, no binary needed)
  # ============================================================================

  image:portal:*:
    desc: "Build Harbor Portal Docker image (Angular frontend)"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: "goharbor/harbor-portal:{{.VERSION}}-{{.PLATFORM}}"
    cmds:
      - |
        echo "🐳 Building Portal image for {{.PLATFORM}}..."
        echo "⚠️  This is a multi-stage build and will take several minutes..."
        docker buildx build \
          --platform linux/{{.ARCH}} \
          -t {{.TAG}} \
          -f dockerfiles/portal.dockerfile \
          --load \
          .
      - |
        echo "✓ Portal image built: {{.TAG}}"
        docker images | grep harbor-portal | head -1

  # ============================================================================
  # Registry Image (multi-stage, builds from source)
  # ============================================================================

  image:registry:*:
    desc: "Build Docker Registry (Distribution) image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: "goharbor/registry-photon:{{.VERSION}}-{{.PLATFORM}}"
    cmds:
      - |
        echo "🐳 Building Registry image for {{.PLATFORM}}..."
        echo "⚠️  This builds distribution from source..."
        docker buildx build \
          --platform linux/{{.ARCH}} \
          -t {{.TAG}} \
          -f dockerfiles/registry.dockerfile \
          --load \
          .
      - |
        echo "✓ Registry image built: {{.TAG}}"
        docker images | grep registry-photon | head -1

  # ============================================================================
  # Trivy Adapter Image (multi-stage)
  # ============================================================================

  image:trivy-adapter:*:
    desc: "Build Trivy Adapter Docker image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: "goharbor/trivy-adapter-photon:{{.VERSION}}-{{.PLATFORM}}"
    cmds:
      - |
        echo "🐳 Building Trivy Adapter image for {{.PLATFORM}}..."
        echo "⚠️  This builds trivy-adapter from source..."
        docker buildx build \
          --platform linux/{{.ARCH}} \
          -t {{.TAG}} \
          -f dockerfiles/trivy-adapter.dockerfile \
          --load \
          .
      - |
        echo "✓ Trivy Adapter image built: {{.TAG}}"
        docker images | grep trivy-adapter | head -1

  # ============================================================================
  # Nginx Image (simple)
  # ============================================================================

  image:nginx:*:
    desc: "Build Harbor Nginx proxy image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: "goharbor/nginx-photon:{{.VERSION}}-{{.PLATFORM}}"
    cmds:
      - |
        echo "🐳 Building Nginx image for {{.PLATFORM}}..."
        docker buildx build \
          --platform linux/{{.ARCH}} \
          -t {{.TAG}} \
          -f dockerfiles/nginx.dockerfile \
          --load \
          .
      - |
        echo "✓ Nginx image built: {{.TAG}}"
        docker images | grep nginx-photon | head -1

  # ============================================================================
  # Image Push Tasks (with registry upload)
  # ============================================================================

  all-images:push:
    desc: "Build and push all Harbor images to registry"
    deps:
      - image:core:linux-amd64:push
      - image:core:linux-arm64:push
      - image:jobservice:linux-amd64:push
      - image:jobservice:linux-arm64:push
      - image:registryctl:linux-amd64:push
      - image:registryctl:linux-arm64:push
      - image:exporter:linux-amd64:push
      - image:exporter:linux-arm64:push
      - image:portal:linux-amd64:push
      - image:portal:linux-arm64:push
      - image:registry:linux-amd64:push
      - image:registry:linux-arm64:push
      - image:trivy-adapter:linux-amd64:push
      - image:trivy-adapter:linux-arm64:push
      - image:nginx:linux-amd64:push
      - image:nginx:linux-arm64:push
    cmds:
      - echo "✓ All images pushed to {{.REGISTRY}}/{{.IMAGE_NAMESPACE}}"

  all-images:amd64:push:
    desc: "Build and push all images for linux/amd64"
    deps:
      - image:core:linux-amd64:push
      - image:jobservice:linux-amd64:push
      - image:registryctl:linux-amd64:push
      - image:exporter:linux-amd64:push
      - image:portal:linux-amd64:push
      - image:registry:linux-amd64:push
      - image:trivy-adapter:linux-amd64:push
      - image:nginx:linux-amd64:push
    cmds:
      - echo "✓ All amd64 images pushed"

  all-images:arm64:push:
    desc: "Build and push all images for linux/arm64"
    deps:
      - image:core:linux-arm64:push
      - image:jobservice:linux-arm64:push
      - image:registryctl:linux-arm64:push
      - image:exporter:linux-arm64:push
      - image:portal:linux-arm64:push
      - image:registry:linux-arm64:push
      - image:trivy-adapter:linux-arm64:push
      - image:nginx:linux-arm64:push
    cmds:
      - echo "✓ All arm64 images pushed"

  # Core service push tasks
  image:core:*:push:
    desc: "Build and push Core image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/harbor-core:{{.IMAGE_TAG}}-{{.PLATFORM}}'
    deps:
      - build:binary:core:{{.PLATFORM}}
    cmds:
      - echo "Building and pushing Core image for {{.PLATFORM}}..."
      - docker buildx build --platform linux/{{.ARCH}} --build-arg TARGETARCH={{.ARCH}} -t {{.TAG}} -f dockerfiles/core.dockerfile --push .
      - echo "Core image pushed - {{.TAG}}"

  # Jobservice push tasks
  image:jobservice:*:push:
    desc: "Build and push Jobservice image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/harbor-jobservice:{{.IMAGE_TAG}}-{{.PLATFORM}}'
    deps:
      - build:binary:jobservice:{{.PLATFORM}}
    cmds:
      - echo "Building and pushing Jobservice image for {{.PLATFORM}}..."
      - docker buildx build --platform linux/{{.ARCH}} --build-arg TARGETARCH={{.ARCH}} -t {{.TAG}} -f dockerfiles/jobservice.dockerfile --push .
      - echo "Jobservice image pushed - {{.TAG}}"

  # Registryctl push tasks
  image:registryctl:*:push:
    desc: "Build and push Registryctl image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/harbor-registryctl:{{.IMAGE_TAG}}-{{.PLATFORM}}'
    deps:
      - build:binary:registryctl:{{.PLATFORM}}
    cmds:
      - echo "Building and pushing Registryctl image for {{.PLATFORM}}..."
      - docker buildx build --platform linux/{{.ARCH}} --build-arg TARGETARCH={{.ARCH}} -t {{.TAG}} -f dockerfiles/registryctl.dockerfile --push .
      - echo "Registryctl image pushed - {{.TAG}}"

  # Exporter push tasks
  image:exporter:*:push:
    desc: "Build and push Exporter image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/harbor-exporter:{{.IMAGE_TAG}}-{{.PLATFORM}}'
    deps:
      - build:binary:exporter:{{.PLATFORM}}
    cmds:
      - echo "Building and pushing Exporter image for {{.PLATFORM}}..."
      - docker buildx build --platform linux/{{.ARCH}} --build-arg TARGETARCH={{.ARCH}} -t {{.TAG}} -f dockerfiles/exporter.dockerfile --push .
      - echo "Exporter image pushed - {{.TAG}}"

  # Portal push tasks
  image:portal:*:push:
    desc: "Build and push Portal image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/harbor-portal:{{.IMAGE_TAG}}-{{.PLATFORM}}'
    cmds:
      - echo "Building and pushing Portal image for {{.PLATFORM}}..."
      - docker buildx build --platform linux/{{.ARCH}} --build-arg TARGETARCH={{.ARCH}} -t {{.TAG}} -f dockerfiles/portal.dockerfile --push .
      - echo "Portal image pushed - {{.TAG}}"

  # Registry push tasks
  image:registry:*:push:
    desc: "Build and push Registry image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/registry-photon:{{.IMAGE_TAG}}-{{.PLATFORM}}'
    cmds:
      - echo "Building and pushing Registry image for {{.PLATFORM}}..."
      - docker buildx build --platform linux/{{.ARCH}} --build-arg TARGETARCH={{.ARCH}} -t {{.TAG}} -f dockerfiles/registry.dockerfile --push .
      - echo "Registry image pushed - {{.TAG}}"

  # Trivy Adapter push tasks
  image:trivy-adapter:*:push:
    desc: "Build and push Trivy Adapter image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/trivy-adapter-photon:{{.IMAGE_TAG}}-{{.PLATFORM}}'
    cmds:
      - echo "Building and pushing Trivy Adapter image for {{.PLATFORM}}..."
      - docker buildx build --platform linux/{{.ARCH}} --build-arg TARGETARCH={{.ARCH}} -t {{.TAG}} -f dockerfiles/trivy-adapter.dockerfile --push .
      - echo "Trivy Adapter image pushed - {{.TAG}}"

  # Nginx push tasks
  image:nginx:*:push:
    desc: "Build and push Nginx image"
    vars:
      PLATFORM: '{{index .MATCH 0}}'
      ARCH: '{{if eq .PLATFORM "linux-amd64"}}amd64{{else}}arm64{{end}}'
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/nginx-photon:{{.IMAGE_TAG}}-{{.PLATFORM}}'
    cmds:
      - echo "Building and pushing Nginx image for {{.PLATFORM}}..."
      - docker buildx build --platform linux/{{.ARCH}} --build-arg TARGETARCH={{.ARCH}} -t {{.TAG}} -f dockerfiles/nginx.dockerfile --push .
      - echo "Nginx image pushed - {{.TAG}}"

  # ============================================================================
  # Multi-Arch Manifest Creation
  # ============================================================================

  all-manifests:
    desc: "Create multi-arch manifests for all images"
    deps:
      - image:manifest:core
      - image:manifest:jobservice
      - image:manifest:registryctl
      - image:manifest:exporter
      - image:manifest:portal
      - image:manifest:registry
      - image:manifest:trivy-adapter
      - image:manifest:nginx
    cmds:
      - echo "✓ All multi-arch manifests created"

  image:manifest:core:
    desc: "Create multi-arch manifest for Core"
    vars:
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/harbor-core:{{.IMAGE_TAG}}'
    deps:
      - image:core:linux-amd64:push
      - image:core:linux-arm64:push
    cmds:
      - echo "Creating multi-arch manifest for Core..."
      - docker buildx imagetools create -t {{.TAG}} {{.TAG}}-linux-amd64 {{.TAG}}-linux-arm64
      - echo "Core manifest created - {{.TAG}}"

  image:manifest:jobservice:
    desc: "Create multi-arch manifest for Jobservice"
    vars:
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/harbor-jobservice:{{.IMAGE_TAG}}'
    deps:
      - image:jobservice:linux-amd64:push
      - image:jobservice:linux-arm64:push
    cmds:
      - echo "Creating multi-arch manifest for Jobservice..."
      - docker buildx imagetools create -t {{.TAG}} {{.TAG}}-linux-amd64 {{.TAG}}-linux-arm64
      - echo "Jobservice manifest created - {{.TAG}}"

  image:manifest:registryctl:
    desc: "Create multi-arch manifest for Registryctl"
    vars:
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/harbor-registryctl:{{.IMAGE_TAG}}'
    deps:
      - image:registryctl:linux-amd64:push
      - image:registryctl:linux-arm64:push
    cmds:
      - echo "Creating multi-arch manifest for Registryctl..."
      - docker buildx imagetools create -t {{.TAG}} {{.TAG}}-linux-amd64 {{.TAG}}-linux-arm64
      - echo "Registryctl manifest created - {{.TAG}}"

  image:manifest:exporter:
    desc: "Create multi-arch manifest for Exporter"
    vars:
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/harbor-exporter:{{.IMAGE_TAG}}'
    deps:
      - image:exporter:linux-amd64:push
      - image:exporter:linux-arm64:push
    cmds:
      - echo "Creating multi-arch manifest for Exporter..."
      - docker buildx imagetools create -t {{.TAG}} {{.TAG}}-linux-amd64 {{.TAG}}-linux-arm64
      - echo "Exporter manifest created - {{.TAG}}"

  image:manifest:portal:
    desc: "Create multi-arch manifest for Portal"
    vars:
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/harbor-portal:{{.IMAGE_TAG}}'
    deps:
      - image:portal:linux-amd64:push
      - image:portal:linux-arm64:push
    cmds:
      - echo "Creating multi-arch manifest for Portal..."
      - docker buildx imagetools create -t {{.TAG}} {{.TAG}}-linux-amd64 {{.TAG}}-linux-arm64
      - echo "Portal manifest created - {{.TAG}}"

  image:manifest:registry:
    desc: "Create multi-arch manifest for Registry"
    vars:
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/registry-photon:{{.IMAGE_TAG}}'
    deps:
      - image:registry:linux-amd64:push
      - image:registry:linux-arm64:push
    cmds:
      - echo "Creating multi-arch manifest for Registry..."
      - docker buildx imagetools create -t {{.TAG}} {{.TAG}}-linux-amd64 {{.TAG}}-linux-arm64
      - echo "Registry manifest created - {{.TAG}}"

  image:manifest:trivy-adapter:
    desc: "Create multi-arch manifest for Trivy Adapter"
    vars:
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/trivy-adapter-photon:{{.IMAGE_TAG}}'
    deps:
      - image:trivy-adapter:linux-amd64:push
      - image:trivy-adapter:linux-arm64:push
    cmds:
      - echo "Creating multi-arch manifest for Trivy Adapter..."
      - docker buildx imagetools create -t {{.TAG}} {{.TAG}}-linux-amd64 {{.TAG}}-linux-arm64
      - echo "Trivy Adapter manifest created - {{.TAG}}"

  image:manifest:nginx:
    desc: "Create multi-arch manifest for Nginx"
    vars:
      TAG: '{{.REGISTRY}}/{{.IMAGE_NAMESPACE}}/nginx-photon:{{.IMAGE_TAG}}'
    deps:
      - image:nginx:linux-amd64:push
      - image:nginx:linux-arm64:push
    cmds:
      - echo "Creating multi-arch manifest for Nginx..."
      - docker buildx imagetools create -t {{.TAG}} {{.TAG}}-linux-amd64 {{.TAG}}-linux-arm64
      - echo "Nginx manifest created - {{.TAG}}"

  # ============================================================================
  # Utilities
  # ============================================================================

  clean:
    desc: "🧹 Clean all Harbor Docker images"
    cmds:
      - |
        echo "Removing Harbor images..."
        docker images | grep goharbor | awk '{print $3}' | xargs -r docker rmi -f || true
        echo "✓ Images cleaned"

  prune:
    desc: "🧹 Prune Docker build cache"
    cmds:
      - docker builder prune -f
      - echo "✓ Build cache pruned"

  list:
    desc: "📋 List all Harbor images"
    cmds:
      - |
        echo "Harbor Images:"
        docker images | grep -E "goharbor|REPOSITORY" || echo "No Harbor images found"

  inspect:*:
    desc: "🔍 Inspect a specific Harbor image"
    vars:
      IMAGE: '{{index .MATCH 0}}'
    cmds:
      - |
        echo "Inspecting {{.IMAGE}}..."
        docker inspect goharbor/harbor-{{.IMAGE}}:{{.VERSION}}-linux-amd64

  test:*:
    desc: "🧪 Test if an image runs"
    vars:
      IMAGE: '{{index .MATCH 0}}'
    cmds:
      - |
        echo "Testing {{.IMAGE}} image..."
        docker run --rm --entrypoint /bin/sh \
          goharbor/harbor-{{.IMAGE}}:{{.VERSION}}-linux-amd64 \
          -c "echo 'Image OK'" || echo "⚠️  Image test failed (may need specific entrypoint)"
